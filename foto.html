<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clara & Miryam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="css/styles.css" rel="stylesheet" />

    <!-- Google fonts-->
    <link href="https://fonts.googleapis.com/css?family=Varela+Round" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet" />
 
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');
        
        #pwform {
            background-image: url('assets/img/sunflower sky.jpg');
            background-size: cover;
            background-color: rgba(0, 0, 0, 0.2); /* Sfondo con trasparenza */
            background-blend-mode: multiply; /* Prova anche overlay, darken, lighten */
            height: 100vh;
        }

        .great-vibes-regular {
            font-family: "Great Vibes", serif;
            font-weight: 400;
            font-style: normal;
        }

        .color-light-pink {
            color: #F6EAF3
        }

        .offcanvas {
                background-color: rgba(255, 255, 255, 0.9);
        }

        .navbar-custom {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            height: 70px;
        }

        #pwform {
            height: fit-content; /* Adatta l'altezza al contenuto */
            min-height: 100vh;
        }

        #pw-container {
            padding-top: 130px; /* Aggiunto padding per centrare il contenuto */
        }


        /* Retina/HiDPI */
        @media (min-resolution: 2dppx) {
            .bg-btn { background-image: url('icon@2x.png'); }
        }
        .bg-btn:focus-visible {
            outline: 2px solid #005fcc; outline-offset: 2px; border-radius: 8px;
        }

        #miry-clara-photo {
            width: 100%;
            height: auto;
        }

        #miry-clara-photo:hover {
            transform: scale(1.05);
            transition: transform 0.3s ease-in-out;
        }

        .image-container {
            position: relative;
            display: inline-block;
            overflow: hidden;
        }

        .image-container img {
            display: block;
            transition: filter 0.4s ease;
        }

        /* testo sopra l'immagine */
        .image-container .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.4s ease;
            text-align: center;
            pointer-events: none; /* così non blocca il click sul link */
        }

        /* effetto hover */
        .image-container:hover img {
            filter: brightness(60%);
        }

        .image-container:hover .overlay-text {
            opacity: 1;
        }

    </style>
</head>

<body>

    <!-- Navbar con Offcanvas -->
    <nav class="navbar navbar-dark navbar-custom fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <!-- Offcanvas Menu -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
        <div class="offcanvas-header">
            <a class="nav-link" href="index.html"><h5 class="offcanvas-title"><i>Clara & Miry</i></h5></a>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="login.html">Unser Fest / La nostra festa</a></li>
                <li class="nav-item"><a class="nav-link" href="gift.html">Geschenk / Regalo</a></li>
                <li class="nav-item"><a class="nav-link" href="foto.html">Fotografie / Fotos</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Kontakte / Contatti</a></li>
            </ul>
        </div>
    </div>

    <!-- Main Section -->
    <section class="access-form d-flex flex-column justify-content-center align-items-center flex-grow-1" id="pwform">
        <div class="container" id="pw-container">
            <div class="row justify-content-center align-items-center">
                <h1 class="great-vibes-regular color-light-pink" style="font-size: 3em;">Piccoli ricordi di un giorno speciale</h1>

                <h1 class="great-vibes-regular color-light-pink mt-4" style="font-size: 3em;">Kleine Erinnerungen an einen besonderen Tag</h1>
                
                <div class="row justify-content-center align-items-center mt-5">
                    <div class="col-lg-6 col-md-10 col-md-10 image-container">
                        <a href="https://drive.google.com/drive/folders/17EcB7-bi7hUmzdwf4XMhrne7eZrC0FQL?usp=sharing">
                            <img src="assets/img/miry-clara-photo.jpeg" alt="Clara & Miryam" id="miry-clara-photo" class="img-fluid">
                            <div class="overlay-text">
                                <i>Rivivi la nostra festa</i>
                                <i>Erlebe unser Fest noch einmal</i>
                            </div>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <!-- Bootstrap Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
